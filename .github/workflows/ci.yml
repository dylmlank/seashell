name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target and used to be the one platform CI
        # never exercised. Linux stays for the cheap fast feedback.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run typecheck
      # Tauri crate/npm version drift only surfaces during "tauri build" —
      # i.e. in a release, after the tag is already pushed. Catch it here.
      - run: bun scripts/check-tauri-versions.ts
      - run: bun run lint
      # sidecar.test.ts spawns a real sidecar and is excluded on purpose;
      # everything else is pure and runs everywhere.
      - run: bun test tests/heuristics.test.ts tests/reduce-event.test.ts tests/json-file.test.ts tests/fs-guard.test.ts tests/redact.test.ts tests/budget.test.ts tests/mcp-servers.test.ts tests/tauri-versions.test.ts
      # Separate process: the DOM registrar replaces globals (WebSocket among
      # them) for every file sharing a bun test run.
      - run: bun run test:ui

  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # The renderer dist has to exist for tauri's build script to resolve it.
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build:renderer
      - run: bun run build:sidecar
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml
